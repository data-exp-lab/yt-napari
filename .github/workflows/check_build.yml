name: Check Build
on: pull_request

jobs:
  twinecheck:
    name: twinecheck
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -U build twine
    - name: Build and check
      run: |
        python -m build
        twine check dist/*
    - name: Install wheel and import outside the source tree
      run: |
        pip install dist/*.whl
        cd /tmp && python -c "import yt_napari.viewer, yt_napari.timeseries; from yt_napari._ds_cache import get_sample_set_list; assert get_sample_set_list()"
